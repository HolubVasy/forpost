# forpost deploy slots - HTTP (port 80): ACME challenge + redirect to HTTPS.
#
# Include this FIRST (before the cert exists) so certbot can validate the three
# names over HTTP-01, then obtain the SAN cert, then enable forpost-slots.conf.
# See nginx/README.md for the one-time bootstrap.
server {
    listen 80;
    listen [::]:80;
    server_name alpha1.poly-mind.net alpha2.poly-mind.net alpha3.poly-mind.net;

    # HTTP-01 challenge for the SAN cert covering all three slot names.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
