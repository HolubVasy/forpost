# forpost deploy slots - HTTPS (port 443): alpha1|alpha2|alpha3.poly-mind.net.
#
# A slot is a fixed "parking spot" (name + route + network), NOT an image. What
# runs in it is the solution's own container, named alphaN, on the shared docker
# network. ForPost occupies a slot by bringing that container up, frees it by
# stopping it - this nginx config NEVER changes on deploy.
#
# How the empty-vs-occupied switch works without editing config:
#   - `resolver` + a variable in proxy_pass defer name resolution to request time,
#     so nginx starts even when no alphaN container exists.
#   - if the container is absent/down, proxy_pass 502s -> error_page -> @empty,
#     which serves the static "slot free" page.
#   - bring up a container named alphaN on this network -> the same block proxies
#     to it immediately. No reload, no rewrite.
#
# Enable this file only AFTER the SAN cert exists (see forpost-slots-http.conf
# and nginx/README.md), otherwise the ssl_certificate directives fail nginx -t.

map $host $slot_upstream {
    default               "";
    alpha1.poly-mind.net  alpha1:8080;
    alpha2.poly-mind.net  alpha2:8080;
    alpha3.poly-mind.net  alpha3:8080;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alpha1.poly-mind.net alpha2.poly-mind.net alpha3.poly-mind.net;

    # SAN cert issued for all three slot names (certbot --cert-name alpha-slots).
    ssl_certificate     /etc/letsencrypt/live/alpha-slots/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpha-slots/privkey.pem;

    # A generous but bounded body size; solutions are lab services, not uploads.
    client_max_body_size 25m;

    location / {
        # Docker embedded DNS - lets us resolve alphaN lazily, per request.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $up $slot_upstream;

        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;   # websockets
        proxy_set_header Connection        "upgrade";

        # Empty slot (no container) or a crashed one -> friendly static page.
        proxy_intercept_errors on;
        proxy_connect_timeout 3s;
        error_page 502 503 504 = @empty;
    }

    location @empty {
        internal;
        root /usr/share/nginx/html/forpost-slots;
        try_files /slot-empty.html =503;
        default_type text/html;
    }
}
