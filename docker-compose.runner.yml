# Opt-in sandboxed Claude Code agent (variant A: one persistent container).
# Separate from the ForPost deploy on purpose - bring it up only when wanted:
#   docker compose -f docker-compose.runner.yml up -d --build
# Drive it from ForPost (full-access):
#   docker exec claude-runner task "<goal>"
services:
  claude-runner:
    build: ./claude-sandbox
    image: claude-runner:latest
    container_name: claude-runner
    restart: unless-stopped
    env_file:
      - .runner.env            # CLAUDE_CODE_OAUTH_TOKEN + personal GITHUB_TOKEN
    working_dir: /work
    volumes:
      - runner_work:/work      # the agent's scratch/clones (no host mounts)
    # Deliberately NO /var/run/docker.sock and NO host bind mounts -> sandbox.
    mem_limit: 2g
    cpus: "1.5"

volumes:
  runner_work:
